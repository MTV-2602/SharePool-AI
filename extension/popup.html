<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <style>
    :root {
      --bg: #07090f;
      --surface: #0d1117;
      --surface2: #161b22;
      --border: #21262d;
      --accent: #2563eb;
      --accent2: #7c3aed;
      --text: #f0f6fc;
      --text2: #8b949e;
      --success: #2ea043;
      --error: #da3633;
    }
    
    body {
      width: 320px;
      margin: 0;
      padding: 16px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      box-sizing: border-box;
    }
    
    .header {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 16px;
      border-bottom: 1px solid var(--border);
      padding-bottom: 10px;
    }
    
    .logo {
      font-size: 24px;
    }
    
    .title {
      font-size: 16px;
      font-weight: 700;
      background: linear-gradient(135deg, var(--accent2), var(--accent));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    
    .subtitle {
      font-size: 11px;
      color: var(--text2);
    }
    
    .form-group {
      margin-bottom: 12px;
    }
    
    label {
      display: block;
      font-size: 11px;
      color: var(--text2);
      margin-bottom: 4px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    
    input[type="text"], input[type="password"] {
      width: 100%;
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 8px 10px;
      color: var(--text);
      font-size: 12px;
      outline: none;
      box-sizing: border-box;
    }
    
    input:focus {
      border-color: var(--accent);
    }
    
    .checkbox-group {
      display: flex;
      align-items: center;
      gap: 8px;
      margin: 14px 0;
      font-size: 12px;
      color: var(--text);
    }
    
    .btn-push {
      width: 100%;
      background: linear-gradient(135deg, var(--accent2), var(--accent));
      border: none;
      border-radius: 6px;
      padding: 10px;
      color: white;
      font-weight: 600;
      font-size: 13px;
      cursor: pointer;
      transition: all 0.2s;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }
    
    .btn-push:hover {
      box-shadow: 0 0 12px rgba(124, 58, 237, 0.4);
    }
    
    .status-box {
      margin-top: 12px;
      padding: 8px 12px;
      border-radius: 6px;
      font-size: 12px;
      display: none;
    }
    
    .status-box.success {
      display: block;
      background: rgba(46, 160, 67, 0.15);
      border: 1px solid rgba(46, 160, 67, 0.3);
      color: #4ade80;
    }
    
    .status-box.error {
      display: block;
      background: rgba(218, 54, 51, 0.15);
      border: 1px solid rgba(218, 54, 51, 0.3);
      color: #ff6b6b;
    }
    
    .cookie-status {
      font-size: 12px;
      padding: 10px;
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 6px;
      margin-bottom: 12px;
      line-height: 1.4;
    }
    
    .badge {
      display: inline-block;
      padding: 2px 6px;
      border-radius: 10px;
      font-size: 10px;
      font-weight: 700;
    }
    
    .badge-ok {
      background: rgba(46, 160, 67, 0.2);
      color: #4ade80;
    }
    
    .badge-none {
      background: rgba(218, 54, 51, 0.2);
      color: #ff6b6b;
    }
  </style>
</head>
<body>
  <div class="header">
    <span class="logo">🔄</span>
    <div>
      <div class="title">Codex Session Pusher</div>
      <div class="subtitle">Quick push ChatGPT session tokens</div>
    </div>
  </div>
  
  <div class="cookie-status" id="cookieStatus">
    Checking ChatGPT session...
  </div>
  
  <div class="form-group">
    <label>Codex Portal URL</label>
    <input type="text" id="portalUrl" placeholder="http://localhost:3040">
  </div>
  
  <div class="form-group">
    <label>Push Token</label>
    <input type="password" id="pushToken" placeholder="b081ea5e...">
  </div>
  
  <div class="form-group">
    <label>Account Name Label</label>
    <input type="text" id="namePrefix" placeholder="e.g. ChatGPTExt">
  </div>
  
  <div class="checkbox-group">
    <input type="checkbox" id="autoPush">
    <label for="autoPush" style="text-transform:none; cursor:pointer; font-size:12px; color:var(--text); letter-spacing:0;">Auto push on login</label>
  </div>
  
  <button class="btn-push" id="pushBtn">🚀 Push to Codex Pool</button>
  
  <div class="status-box" id="statusBox"></div>
  
  <script src="popup.js"></script>
</body>
</html>
